
name: Daily 11 Contributions

on:
  schedule:
    # Every day at 6:00 PM IST = 12:30 PM UTC
    - cron: "30 12 * * *"

  # Manual Run button
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-contributions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "Karantiger"
          git config user.email "karantiger9369@gmail.com"

      - name: Create 11 commits
        run: |
          for i in {1..11}
          do
            echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC') - Daily activity #$i" >> activity-log.txt

            git add activity-log.txt

            git commit -m "chore: daily activity update #$i"
          done

      - name: Push commits
        run: |
          git push
